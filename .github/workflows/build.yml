name: Build Washu Firmware
on:
  workflow_dispatch:
  push:
    branches:
      - washu
permissions:
  contents: read
jobs:
  build:
    name: Build bread-compact-esp32
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py prepare
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: washu_firmware_esp32
          path: build/merged-binary.bin
          if-no-files-found: error
