name: Build Washu Firmware
on:
  workflow_dispatch:
  push:
    branches:
      - washu
permissions:
  contents: read
jobs:
  build:
    name: Build bread-compact-esp32
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source $IDF_PATH/export.sh
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.bread-compact-esp32" set-target esp32
          idf.py build
          idf.py merge-bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: washu_firmware_esp32
          path: build/merged-binary.bin
          if-no-files-found: error
